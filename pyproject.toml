[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-flashcard-learning"
version = "0.1.0"
description = "A fully local adaptive flashcard learning application."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
